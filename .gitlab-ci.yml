stages:
  - test
  - publish

default:
  image: node:22

test:
  stage: test
  script:
    - npm ci
    - npm run typecheck
    - npm test
  cache:
    key: node-modules
    paths:
      - node_modules/

publish:
  stage: publish
  script:
    - npm ci
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish
  rules:
    # Only run on version tags (e.g. v0.1.0)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: npm
